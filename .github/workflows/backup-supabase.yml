name: Nightly Supabase Data Backup

on:
  schedule:
    - cron: '0 2 * * *' # Aja joka yö klo 02:00 UTC (klo 05:00 Suomen aikaa)
  workflow_dispatch: # Mahdollistaa manuaalisen käynnistyksen GitHubin kautta

permissions:
  contents: read

jobs:
  backup:
    name: Backup Supabase Database to Secure Artifact
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 💾 Run Supabase Backup Script
        run: node scripts/backup-supabase.js

      - name: 📤 Upload Backup Archive as Secure Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subsoccer-database-backup-${{ github.run_id }}
          path: backups/
          retention-days: 60
          if-no-files-found: error
