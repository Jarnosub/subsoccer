<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subsoccer — Pin Your Table to the Map</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        @font-face { font-family: 'Subsoccer'; src: url('fonts/Subsoccer-2-Regular.woff2') format('woff2'); font-display: swap; }
        @font-face { font-family: 'Resolve'; src: url('fonts/Resolve-BoldNrw.otf') format('opentype'); font-display: swap; }
        :root { --sub-red: #c41e2a; --sub-radius: 6px; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #0d0e11;
            color: #fff;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 20px env(safe-area-inset-bottom, 30px) 20px;
        }

        .pin-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pin-header {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 24px;
        }
        .pin-header img { width: 85px; margin-bottom: 15px; cursor: pointer; }
        .pin-header h1 {
            font-family: 'Subsoccer', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
            font-weight: normal;
        }
        .pin-header p {
            font-family: 'Resolve', sans-serif;
            color: #888;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .card {
            width: 100%;
            background: #16171b;
            border: 1px solid #282a30;
            border-radius: 12px;
            padding: 22px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .loc-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--sub-radius);
            padding: 12px 14px;
        }
        .loc-badge i { font-size: 1.2rem; color: var(--sub-red); }
        .loc-details { min-width: 0; flex: 1; }
        .loc-city { font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loc-status { font-size: 0.7rem; color: #888; margin-top: 2px; }

        .type-selector {
            display: flex;
            gap: 10px;
        }
        .type-btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: var(--sub-radius);
            border: 1px solid #333;
            background: #1f2026;
            color: #ccc;
            font-family: 'Resolve', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .type-btn i { font-size: 1.3rem; }
        .type-btn:hover { border-color: #666; color: #fff; }
        .type-btn.active {
            border-color: var(--sub-red);
            background: rgba(196, 30, 42, 0.12);
            color: #fff;
        }
        .type-btn.active i { color: var(--sub-red); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-family: 'Resolve', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #888;
            text-transform: uppercase;
        }
        .form-group input {
            background: #1f2026;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            border-radius: var(--sub-radius);
            font-size: 0.95rem;
            font-family: 'Open Sans', sans-serif;
            transition: border-color 0.2s;
            width: 100%;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--sub-red);
            box-shadow: 0 0 0 3px rgba(196, 30, 42, 0.2);
        }

        .quick-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .preset-tag {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .preset-tag:hover { background: rgba(255,255,255,0.12); color: #fff; border-color: #555; }

        .btn-submit {
            background: var(--sub-red);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: var(--sub-radius);
            font-family: 'Subsoccer', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(196, 30, 42, 0.35);
            margin-top: 6px;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(1px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* SUCCESS VIEW */
        #success-view {
            display: none;
            text-align: center;
            width: 100%;
        }
        .success-badge {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 20px;
        }
        .success-badge i { font-size: 2.5rem; color: #4caf50; margin-bottom: 12px; }
        .success-badge h2 { font-family: 'Subsoccer', sans-serif; font-size: 1.6rem; letter-spacing: 2px; color: #fff; font-weight: normal; margin-bottom: 6px; }
        .success-badge p { font-size: 0.85rem; color: #aaa; line-height: 1.5; }

        #preview-map {
            width: 100%;
            height: 160px;
            border-radius: var(--sub-radius);
            border: 1px solid #333;
            margin-top: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            padding: 14px;
            border-radius: var(--sub-radius);
            font-family: 'Resolve', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-outline:hover { border-color: #888; color: #fff; }

        .btn-whatsapp {
            background: #25D366;
            color: #000;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: var(--sub-radius);
            font-family: 'Open Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- BACK BUTTON -->
    <button onclick="window.location.href='index.html'" aria-label="Back to home" style="position: absolute; top: 20px; left: 20px; background: rgba(30,30,30,0.8); backdrop-filter: blur(5px); border: 1px solid #333; color: #fff; font-size: 1.1rem; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="pin-container">
        
        <div class="pin-header">
            <img src="subsoccer_logo.svg" alt="Subsoccer" onclick="window.location.href='index.html'">
            <h1>PIN TO MAP</h1>
            <p>Add this Subsoccer table to the global network</p>
        </div>

        <!-- FORM CARD -->
        <div class="card" id="form-card">
            
            <!-- DETECTED LOCATION -->
            <div class="loc-badge">
                <i class="fa-solid fa-location-dot"></i>
                <div class="loc-details">
                    <div class="loc-city" id="detected-city">Detecting location...</div>
                    <div class="loc-status" id="detected-status">Using GPS & Geo telemetry</div>
                </div>
            </div>

            <!-- TYPE SELECTOR -->
            <div class="form-group">
                <label>Table Type</label>
                <div class="type-selector">
                    <button type="button" class="type-btn active" id="btn-public" onclick="setType('public')">
                        <i class="fa-solid fa-building"></i>
                        <span>PUBLIC VENUE</span>
                    </button>
                    <button type="button" class="type-btn" id="btn-home" onclick="setType('home')">
                        <i class="fa-solid fa-house"></i>
                        <span>HOME / PRIVATE</span>
                    </button>
                </div>
            </div>

            <!-- VENUE / TABLE NAME -->
            <div class="form-group">
                <label id="name-label">Venue / Location Name</label>
                <input type="text" id="venue-name" placeholder="e.g. Kallio Bar, Office Lounge..." maxlength="50" autocomplete="off">
                <div class="quick-presets" id="presets-container">
                    <span class="preset-tag" onclick="applyPreset('Sports Bar & Lounge')">🍺 Sports Bar</span>
                    <span class="preset-tag" onclick="applyPreset('Office Arena')">💼 Office Arena</span>
                    <span class="preset-tag" onclick="applyPreset('School Gym')">🏫 School</span>
                    <span class="preset-tag" onclick="applyPreset('Youth Club')">🎮 Youth Club</span>
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <button class="btn-submit" id="btn-pin" onclick="submitPin()">
                <i class="fa-solid fa-map-pin"></i> <span>PIN THIS TABLE</span>
            </button>

        </div>

        <!-- SUCCESS VIEW -->
        <div id="success-view">
            <div class="success-badge">
                <i class="fa-solid fa-circle-check"></i>
                <h2>TABLE PINNED!</h2>
                <p id="success-text">Your Subsoccer table is now officially on the map.</p>
                <div id="preview-map"></div>
            </div>

            <a id="whatsapp-share" class="btn-whatsapp" target="_blank" href="#">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> Share Table Link on WhatsApp
            </a>

            <div style="display: flex; gap: 10px; width: 100%; margin-top: 12px;">
                <a href="index.html" class="btn-outline" style="flex: 1;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="index.html" onclick="sessionStorage.setItem('open-map','1');" class="btn-outline" style="flex: 1; border-color: var(--sub-red); color: #fff;">
                    <i class="fa-solid fa-map"></i> View Map
                </a>
            </div>
        </div>

    </div>

    <script>
        const SUPA_URL  = 'https://ujxmmrsmdwrgcwatdhvx.supabase.co';
        const SUPA_KEY  = 'sb_publishable_hMb0ml4fl2A9GLqm28gemg_CAE5vY8t';
        const _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);

        let _pinType = 'public';
        let _geoData = { lat: 60.1699, lng: 24.9384, city: 'Helsinki', country: 'Finland', precise: false };
        let _currentUser = null;

        // Basic profanity / spam filter
        const PROFANITY_WORDS = [
            'vittu', 'perkele', 'saatana', 'kyrpa', 'paska', 'huora', 
            'fuck', 'shit', 'bitch', 'asshole', 'cunt', 'dick', 'pussy', 'nigger', 'faggot'
        ];

        function isProfane(text) {
            if (!text) return false;
            const lower = text.toLowerCase();
            return PROFANITY_WORDS.some(w => lower.includes(w));
        }

        function sanitizeName(text, fallback) {
            const trimmed = (text || '').trim();
            if (!trimmed || isProfane(trimmed)) {
                return fallback;
            }
            return trimmed.replace(/[<>"]/g, '');
        }

        // Init & Location Detection
        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Check logged in user
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session?.user) _currentUser = session.user;
            } catch (_) {}

            // 2. Fetch IP Geo via Netlify Edge Function
            try {
                const res = await fetch('/.netlify/functions/geo');
                if (res.ok) {
                    const data = await res.json();
                    if (data.city) _geoData.city = data.city;
                    if (data.country) _geoData.country = data.country;
                    if (data.latitude && data.longitude) {
                        _geoData.lat = parseFloat(data.latitude);
                        _geoData.lng = parseFloat(data.longitude);
                    }
                    updateLocationDisplay();
                }
            } catch (_) {}

            // 3. Request precise GPS location smoothly
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        _geoData.lat = pos.coords.latitude;
                        _geoData.lng = pos.coords.longitude;
                        _geoData.precise = true;
                        updateLocationDisplay(true);
                    },
                    () => { updateLocationDisplay(); },
                    { timeout: 6000 }
                );
            } else {
                updateLocationDisplay();
            }
        });

        function updateLocationDisplay(isGps = false) {
            const cityEl = document.getElementById('detected-city');
            const statusEl = document.getElementById('detected-status');
            const locationStr = [_geoData.city, _geoData.country].filter(Boolean).join(', ') || 'Global';
            cityEl.textContent = locationStr;
            statusEl.textContent = isGps ? '📍 High accuracy GPS active' : '🌐 Telemetry location ready';
            if (isGps) statusEl.style.color = '#4caf50';
        }

        function setType(type) {
            _pinType = type;
            document.getElementById('btn-public').classList.toggle('active', type === 'public');
            document.getElementById('btn-home').classList.toggle('active', type === 'home');
            
            const nameInput = document.getElementById('venue-name');
            const presets = document.getElementById('presets-container');
            const nameLabel = document.getElementById('name-label');

            if (type === 'home') {
                nameLabel.textContent = 'Home / Table Nickname (Optional)';
                nameInput.placeholder = 'e.g. Basement Stadium, Home Arena';
                presets.innerHTML = `
                    <span class="preset-tag" onclick="applyPreset('Home Stadium')">🏠 Home Stadium</span>
                    <span class="preset-tag" onclick="applyPreset('Game Room')">🎯 Game Room</span>
                    <span class="preset-tag" onclick="applyPreset('Backyard Arena')">🌳 Backyard Arena</span>
                `;
            } else {
                nameLabel.textContent = 'Venue / Location Name';
                nameInput.placeholder = 'e.g. Kallio Bar, Office Lounge...';
                presets.innerHTML = `
                    <span class="preset-tag" onclick="applyPreset('Sports Bar & Lounge')">🍺 Sports Bar</span>
                    <span class="preset-tag" onclick="applyPreset('Office Arena')">💼 Office Arena</span>
                    <span class="preset-tag" onclick="applyPreset('School Gym')">🏫 School</span>
                    <span class="preset-tag" onclick="applyPreset('Youth Club')">🎮 Youth Club</span>
                `;
            }
        }

        function applyPreset(name) {
            document.getElementById('venue-name').value = name;
        }

        async function submitPin() {
            const btn = document.getElementById('btn-pin');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PINNING TABLE...';

            try {
                // Rate limit: Max 1 pin per device per 24 hours (unless logged in)
                const lastPinned = localStorage.getItem('subsoccer_last_pinned_ts');
                if (lastPinned && !_currentUser) {
                    const diffHours = (Date.now() - parseInt(lastPinned, 10)) / (1000 * 60 * 60);
                    if (diffHours < 24) {
                        alert('You have already pinned a table today! To manage or edit your tables, open My Games.');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fa-solid fa-map-pin"></i> <span>PIN THIS TABLE</span>';
                        return;
                    }
                }

                let lat = _geoData.lat;
                let lng = _geoData.lng;

                // Smart Deduplication: Check if there's already an active table within ~300 meters
                if (lat && lng) {
                    const RADIUS = 0.003; // ~300m
                    const { data: existingNearby } = await _supabase
                        .from('games')
                        .select('id, game_name, location, latitude, longitude')
                        .eq('is_public', true)
                        .gte('latitude', lat - RADIUS)
                        .lte('latitude', lat + RADIUS)
                        .gte('longitude', lng - RADIUS)
                        .lte('longitude', lng + RADIUS)
                        .limit(1);

                    if (existingNearby && existingNearby.length > 0) {
                        const existingTable = existingNearby[0];
                        // Table already exists here! Link to existing instead of creating duplicate
                        document.getElementById('form-card').style.display = 'none';
                        document.getElementById('success-view').style.display = 'block';
                        document.getElementById('success-text').innerHTML = `A Subsoccer table (<strong>${existingTable.game_name}</strong>) is already active at this location! Your games will be tracked here.`;

                        const shareText = encodeURIComponent(`📍 Playing Subsoccer at "${existingTable.game_name}"! Check the map: https://subsoccer.pro`);
                        document.getElementById('whatsapp-share').href = `https://api.whatsapp.com/send?text=${shareText}`;

                        setTimeout(() => {
                            const previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false }).setView([existingTable.latitude, existingTable.longitude], 14);
                            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19 }).addTo(previewMap);
                            L.marker([existingTable.latitude, existingTable.longitude]).addTo(previewMap);
                        }, 100);
                        return;
                    }
                }

                // Home privacy protection: add jitter (500m - 1km) so exact home address isn't published
                if (_pinType === 'home') {
                    lat += (Math.random() - 0.5) * 0.012;
                    lng += (Math.random() - 0.5) * 0.012;
                }

                const locationStr = [_geoData.city, _geoData.country].filter(Boolean).join(', ') || 'Global';
                const defaultName = _pinType === 'home' ? `Home Stadium (${_geoData.city || 'Subsoccer'})` : `Subsoccer Table (${_geoData.city || 'Subsoccer'})`;
                const rawName = document.getElementById('venue-name').value;
                const finalName = sanitizeName(rawName, defaultName);
                const uniqueCode = 'COMMUNITY-' + Date.now();

                // Insert into Supabase games table
                const { data, error } = await _supabase.from('games').insert([{
                    unique_code: uniqueCode,
                    game_name: finalName,
                    location: locationStr,
                    latitude: lat,
                    longitude: lng,
                    is_public: true,
                    verified: false,
                    owner_id: _currentUser?.id || null,
                    registered_at: new Date().toISOString()
                }]).select().single();

                // Mark throttle and save game ID to device storage so guest can manage it in My Games
                localStorage.setItem('subsoccer_last_pinned_ts', Date.now().toString());
                try {
                    const myPinned = JSON.parse(localStorage.getItem('subsoccer_my_pinned_tables') || '[]');
                    if (data?.id && !myPinned.includes(data.id)) {
                        myPinned.push(data.id);
                        localStorage.setItem('subsoccer_my_pinned_tables', JSON.stringify(myPinned));
                    }
                } catch (_) {}

                // Show success view
                document.getElementById('form-card').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
                document.getElementById('success-text').innerHTML = `<strong>${finalName}</strong> in ${locationStr} is now pinned to the global map!`;

                // Set WhatsApp share link
                const shareText = encodeURIComponent(`📍 We just pinned our Subsoccer table "${finalName}" (${locationStr}) to the global Subsoccer map! Check it out: https://subsoccer.pro`);
                document.getElementById('whatsapp-share').href = `https://api.whatsapp.com/send?text=${shareText}`;

                // Render miniature preview map
                setTimeout(() => {
                    const previewMap = L.map('preview-map', { zoomControl: false, attributionControl: false }).setView([lat, lng], 13);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19 }).addTo(previewMap);
                    L.marker([lat, lng]).addTo(previewMap);
                }, 100);

            } catch (err) {
                console.error('Pin error:', err);
                alert('Could not pin table: ' + (err.message || 'Network error'));
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-map-pin"></i> <span>PIN THIS TABLE</span>';
            }
        }
    </script>
</html>
