<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Subsoccer Pro — 1vs1 Arena Duel (Marcus Vance vs Chloe Quinn)</title>
    <link rel="icon" href="favicon.ico">
    <meta name="theme-color" content="#080a0f">
    <meta http-equiv="refresh" content="0; url=instant-play.html?demo=marcus-vs-chloe">
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            if (!params.has('demo')) params.set('demo', 'marcus-vs-chloe');
            window.location.replace('instant-play.html?' + params.toString());
        })();
    </script>
    <style>
        body {
            margin: 0;
            background: #080a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #e30613;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 6px;
        }
        p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin: 0;
        }
    </style>
    <script src="/app-mode.js"></script>
</head>
<body>
    <div class="spinner"></div>
    <h2>Loading 1vs1 Arena Duel</h2>
    <p>Marcus Vance vs Chloe Quinn · Subsoccer Pro</p>
</body>
</html>
