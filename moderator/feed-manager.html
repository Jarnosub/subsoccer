<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Subsoccer - Feed Manager (Moderator)</title>

    <link rel="preconnect" href="https://ujxmmrsmdwrgcwatdhvx.supabase.co">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'Subsoccer';
            src: url('../fonts/Subsoccer-2-Regular.woff2') format('woff2'),
                 url('../fonts/Subsoccer-2-Regular.woff') format('woff'),
                 url('../fonts/Subsoccer-2-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Resolve';
            src: url('../fonts/Resolve-BoldNrw.otf') format('opentype');
            font-display: swap;
        }
        @font-face {
            font-family: 'Open Sans';
            src: url('https://fonts.gstatic.com/s/opensans/v34/memvYaGs126MiZpBA-UvWbX2vVnXBbObj2OVTS-muw.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Open Sans', sans-serif;
            background: #111111;
            color: #ffffff;
            min-height: 100dvh;
            margin: 0;
            padding-bottom: 60px;
        }

        .mod-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            padding-top: calc(15px + env(safe-area-inset-top, 20px));
            background: #181818;
            border-bottom: 1px solid #282828;
        }
        .mod-title {
            font-family: 'Resolve', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #c41e2a;
            font-weight: bold;
        }
        .btn-back {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            text-align: left;
        }

        .container {
            padding: 20px;
            max-width: 680px;
            margin: 0 auto;
        }

        .card {
            background: #1c1c1c;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-family: 'Resolve', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 i { color: #c41e2a; }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-family: 'Resolve', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            background: #121212;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #c41e2a;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-family: 'Resolve', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            color: #eee;
            margin-top: 6px;
        }
        .checkbox-label input {
            accent-color: #c41e2a;
            width: 18px;
            height: 18px;
        }

        /* Preset Image selector */
        .thumb-preset-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 4px;
            background: #141414;
            transition: all 0.2s;
            font-size: 0.7rem;
            color: #888;
            font-family: 'Resolve', sans-serif;
        }
        .thumb-preset-label.active {
            border-color: #c41e2a;
            color: #fff;
            background: #222;
        }
        .preset-img {
            width: 70px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
        }

        .btn-submit {
            width: 100%;
            background: #c41e2a;
            border: none;
            color: #fff;
            font-family: 'Resolve', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1.2px;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #e02432;
        }

        /* Feed list items */
        .feed-item-row {
            background: #151515;
            border: 1px solid #282828;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-handle {
            font-family: 'Resolve', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            color: #c41e2a;
        }
        .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-mini {
            background: #252525;
            border: 1px solid #383838;
            color: #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-family: 'Resolve', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .btn-mini:hover { background: #333; color: #fff; }
        .btn-mini.featured { background: rgba(196, 30, 42, 0.2); border-color: #c41e2a; color: #ff4d5a; }
        .btn-mini.danger:hover { background: #800; border-color: #f00; }
        .item-title {
            font-size: 0.85rem;
            color: #ddd;
            margin: 0;
        }
        .item-link {
            font-size: 0.75rem;
            color: #888;
            text-decoration: none;
            word-break: break-all;
        }
        .item-link:hover { color: #aaa; text-decoration: underline; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="mod-header">
        <button class="btn-back" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
        <div class="mod-title">COMMUNITY FEED MANAGER</div>
        <div style="width: 30px;"></div>
    </header>

    <div class="container">
        <!-- Add Video Form -->
        <section class="card">
            <h2><i class="fa-brands fa-instagram"></i> ADD INSTAGRAM POST / REEL</h2>
            <form id="add-feed-form">
                <div class="form-group">
                    <label for="ig-url">Instagram URL *</label>
                    <input type="url" id="ig-url" class="form-control" placeholder="https://www.instagram.com/reel/C8qL7v-sJ_H/" required autofocus>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="creator-handle">Tekijän @nimi</label>
                        <input type="text" id="creator-handle" class="form-control" placeholder="@subsoccer_official" value="@subsoccer_official">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="caption-text">Kuvateksti / Otsikko</label>
                        <input type="text" id="caption-text" class="form-control" placeholder="esim. Hamilton vs Leclerc Subsoccerissa! 🏎️⚽">
                    </div>
                </div>

                <div class="form-group">
                    <label>Highlight Cover / Thumbnail (Optional)</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                        <label class="thumb-preset-label active" data-img="Subsoccer_tournament_2.jpg">
                            <input type="radio" name="thumb-choice" value="Subsoccer_tournament_2.jpg" checked style="display:none;">
                            <img src="../Subsoccer_tournament_2.jpg" class="preset-img" alt="Preset 1">
                            <span>Stadium 1</span>
                        </label>
                        <label class="thumb-preset-label" data-img="subsoccer-teams-ny2.jpg">
                            <input type="radio" name="thumb-choice" value="subsoccer-teams-ny2.jpg" style="display:none;">
                            <img src="../subsoccer-teams-ny2.jpg" class="preset-img" alt="Preset 2">
                            <span>Match</span>
                        </label>
                        <label class="thumb-preset-label" data-img="hero-real.jpg">
                            <input type="radio" name="thumb-choice" value="hero-real.jpg" style="display:none;">
                            <img src="../hero-real.jpg" class="preset-img" alt="Preset 3">
                            <span>Pro Final</span>
                        </label>
                    </div>
                    <div class="paste-drop-zone" id="paste-drop-zone" style="margin-top: 10px; border: 2px dashed #3a3a3a; border-radius: 8px; padding: 14px; text-align: center; background: #151515; cursor: pointer; transition: all 0.2s;">
                        <i class="fa-solid fa-paste" style="font-size: 1.3rem; color: #c41e2a; margin-bottom: 6px; display: block;"></i>
                        <div style="font-size: 0.82rem; color: #fff; font-weight: 600; font-family: 'Resolve', sans-serif; letter-spacing: 0.5px;">
                            Ota ruutukaappaus (<kbd style="background:#282828; padding:2px 6px; border-radius:3px; font-family:inherit;">Cmd + Ctrl + Shift + 4</kbd>) ja paina <kbd style="background:#282828; padding:2px 6px; border-radius:3px; font-family:inherit;">Cmd + V</kbd>
                        </div>
                        <div style="font-size: 0.72rem; color: #888; margin-top: 4px;">
                            tai raahaa kuva tähän / <label for="custom-thumb-file" style="color: #c41e2a; cursor: pointer; text-decoration: underline;">valitse tiedosto</label>
                            <input type="file" id="custom-thumb-file" accept="image/*" style="display: none;">
                        </div>
                        <span id="custom-thumb-name" style="display:block; font-size: 0.75rem; color: #2ecc71; margin-top: 6px; font-weight: bold;"></span>
                        <div id="thumb-preview-box" style="margin: 10px auto 0; display: none; width: 100%; max-width: 240px; height: 140px; border-radius: 6px; overflow: hidden; border: 2px solid #c41e2a; background-size: cover; background-position: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6);"></div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit-post">
                    <i class="fa-solid fa-plus"></i> ADD TO COMMUNITY FEED
                </button>
            </form>
        </section>

        <!-- Existing Posts List -->
        <section class="card">
            <h2><i class="fa-solid fa-list-check"></i> ACTIVE HIGHLIGHT LINKS</h2>
            <div id="feed-items-list">
                <div style="text-align:center; padding: 20px; color:#888;">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Loading feed items...
                </div>
            </div>
        </section>
    </div>

    <script>
        const SUPA_URL = 'https://ujxmmrsmdwrgcwatdhvx.supabase.co';
        const SUPA_KEY = 'sb_publishable_hMb0ml4fl2A9GLqm28gemg_CAE5vY8t';
        let sb = null;
        let selectedCustomThumb = '';

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
            }
            initThumbPicker();
            initForm();
            await loadManagerItems();
        });

        function initThumbPicker() {
            const presetLabels = document.querySelectorAll('.thumb-preset-label');
            const fileInput = document.getElementById('custom-thumb-file');
            const nameEl = document.getElementById('custom-thumb-name');
            const previewBox = document.getElementById('thumb-preview-box');

            presetLabels.forEach(label => {
                label.addEventListener('click', () => {
                    presetLabels.forEach(l => l.classList.remove('active'));
                    label.classList.add('active');
                    selectedCustomThumb = '';
                    nameEl.textContent = '';
                    previewBox.style.display = 'none';
                });
            });

            function processImageFile(file, labelText) {
                if (!file || !file.type.startsWith('image/')) return;
                nameEl.textContent = labelText || file.name || 'Custom Image';
                presetLabels.forEach(l => l.classList.remove('active'));

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxW = 600;
                        const scale = Math.min(1, maxW / img.width);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        selectedCustomThumb = canvas.toDataURL('image/jpeg', 0.85);
                        previewBox.style.backgroundImage = `url(${selectedCustomThumb})`;
                        previewBox.style.display = 'block';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            const dropZone = document.getElementById('paste-drop-zone');
            if (dropZone) {
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = '#c41e2a';
                    dropZone.style.background = '#202020';
                });
                dropZone.addEventListener('dragleave', () => {
                    dropZone.style.borderColor = '#3a3a3a';
                    dropZone.style.background = '#151515';
                });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = '#3a3a3a';
                    dropZone.style.background = '#151515';
                    if (e.dataTransfer?.files?.[0]) {
                        processImageFile(e.dataTransfer.files[0], e.dataTransfer.files[0].name);
                    }
                });
            }

            fileInput.addEventListener('change', (e) => {
                if (e.target.files?.[0]) {
                    processImageFile(e.target.files[0], e.target.files[0].name);
                }
            });

            // Paste from clipboard (Cmd+V screenshot)
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.startsWith('image/')) {
                        const file = items[i].getAsFile();
                        processImageFile(file, '📋 Pasted Screenshot (Clipboard)');
                        break;
                    }
                }
            });
        }

        function extractInstagramId(url) {
            if (!url) return '';
            const match = url.match(/\/(?:reel|p|reels)\/([A-Za-z0-9_-]+)/);
            return match ? match[1] : '';
        }

        function extractInstagramHandle(url) {
            if (!url) return '';
            const pathMatch = url.match(/instagram\.com\/([A-Za-z0-9._]+)\/(?:reel|p|reels)\//i);
            if (pathMatch && pathMatch[1] && !['reel', 'reels', 'p', 'explore', 'stories'].includes(pathMatch[1].toLowerCase())) {
                return `@${pathMatch[1]}`;
            }
            return '';
        }

        function initForm() {
            const form = document.getElementById('add-feed-form');
            const urlInput = document.getElementById('ig-url');
            const handleInput = document.getElementById('creator-handle');
            const captionInput = document.getElementById('caption-text');

            async function handleUrlInput() {
                const url = urlInput.value.trim();
                const directHandle = extractInstagramHandle(url);
                if (directHandle) {
                    handleInput.value = directHandle;
                }

                const igId = extractInstagramId(url);
                if (!igId) return;

                try {
                    const metaRes = await fetch('/.netlify/functions/fetch-instagram-meta', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    });
                    if (metaRes.ok) {
                        const metaData = await metaRes.json();
                        if (metaData && metaData.success) {
                            if (metaData.creator_handle && metaData.creator_handle !== '@subsoccer_official') {
                                handleInput.value = metaData.creator_handle;
                            }
                            if (metaData.title) {
                                captionInput.value = metaData.title;
                            }
                        }
                    }
                } catch(e) {}
            }

            urlInput.addEventListener('input', handleUrlInput);
            urlInput.addEventListener('change', handleUrlInput);
            urlInput.addEventListener('paste', () => setTimeout(handleUrlInput, 50));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = urlInput.value.trim();

                const igId = extractInstagramId(url);
                if (!igId) {
                    alert('Invalid Instagram URL. Please provide a valid link like https://www.instagram.com/reel/CODE/');
                    return;
                }

                // Determine chosen thumbnail
                let chosenThumb = selectedCustomThumb;
                if (!chosenThumb) {
                    const activePreset = document.querySelector('.thumb-preset-label.active');
                    chosenThumb = activePreset ? activePreset.dataset.img : 'Subsoccer_tournament_2.jpg';
                }

                const handleVal = handleInput.value.trim() || '@subsoccer_official';
                const captionVal = captionInput.value.trim();

                const btn = document.getElementById('btn-submit-post');
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving highlight...';

                try {
                    // Package title with custom thumbnail metadata JSON
                    const titlePayload = JSON.stringify({
                        caption: captionVal,
                        thumb: chosenThumb
                    });

                    if (sb) {
                        const { error } = await sb.from('subsoccer_feed').insert([{
                            url: url,
                            instagram_id: igId,
                            title: titlePayload,
                            creator_handle: handleVal,
                            category: 'featured',
                            is_featured: true,
                            is_active: true,
                            sort_order: 0
                        }]);
                        if (error) throw error;
                    }
                    alert('Post successfully added to Community Feed!');
                    form.reset();
                    handleInput.value = '@subsoccer_official';
                    selectedCustomThumb = '';
                    document.getElementById('custom-thumb-name').textContent = '';
                    document.getElementById('thumb-preview-box').style.display = 'none';
                    await loadManagerItems();
                } catch (err) {
                    console.error('Error adding feed post:', err);
                    alert('Could not add: ' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-plus"></i> ADD TO COMMUNITY FEED';
                }
            });
        }

        async function loadManagerItems() {
            const listEl = document.getElementById('feed-items-list');
            if (!sb) {
                listEl.innerHTML = '<p style="color:#aaa;">Supabase client not loaded.</p>';
                return;
            }

            try {
                const { data, error } = await sb
                    .from('subsoccer_feed')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<p style="color:#777; text-align:center; padding:15px;">No posts found in database yet.</p>';
                    return;
                }

                listEl.innerHTML = '';
                data.forEach(item => {
                    let caption = item.title || '';
                    let thumb = '';
                    try {
                        if (item.title && item.title.startsWith('{')) {
                            const p = JSON.parse(item.title);
                            caption = p.caption || '';
                            thumb = p.thumb || '';
                        }
                    } catch(e) {}

                    const row = document.createElement('div');
                    row.className = 'feed-item-row';
                    row.innerHTML = `
                        <div class="item-top">
                            <div style="display:flex; align-items:center; gap:8px;">
                                ${thumb ? `<img src="${thumb.startsWith('data:') ? thumb : ('../' + thumb)}" style="width:36px; height:36px; object-fit:cover; border-radius:4px; border:1px solid #444;" alt="Thumb">` : ''}
                                <span class="item-handle" style="font-size:0.95rem; font-weight:bold; color:#fff;">${item.creator_handle || '@subsoccer_official'}</span>
                            </div>
                            <div class="item-actions">
                                <button class="btn-mini" onclick="editFeedItem('${item.id}', '${escapeAttr(item.creator_handle || '')}', '${escapeAttr(item.title || '')}')">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </button>
                                <button class="btn-mini ${item.is_featured ? 'featured' : ''}" onclick="toggleFeatured('${item.id}', ${!item.is_featured})">
                                    <i class="fa-solid fa-star"></i> ${item.is_featured ? 'FEATURED' : 'Feature'}
                                </button>
                                <button class="btn-mini danger" onclick="deleteFeedItem('${item.id}')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        ${caption ? `<p class="item-title" style="margin:8px 0; color:#ddd; font-size:0.85rem;">${escapeHtml(caption)}</p>` : ''}
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="item-link" style="color:#c41e2a; font-size:0.75rem;">
                            <i class="fa-brands fa-instagram"></i> ${item.url}
                        </a>
                    `;
                    listEl.appendChild(row);
                });
            } catch (err) {
                listEl.innerHTML = `<p style="color:#e74c3c;">Error loading items: ${err.message}</p>`;
            }
        }

        window.editFeedItem = async (id, currentHandle, currentTitleRaw) => {
            let caption = currentTitleRaw;
            let thumb = '';
            try {
                if (currentTitleRaw && currentTitleRaw.startsWith('{')) {
                    const p = JSON.parse(currentTitleRaw);
                    caption = p.caption || '';
                    thumb = p.thumb || '';
                }
            } catch(e) {}

            const newHandle = prompt('Muokkaa tekijän @nimeä (esim. @scuderiaferrari):', currentHandle || '@subsoccer_official');
            if (newHandle === null) return;

            const newCaption = prompt('Muokkaa kuvatekstiä / otsikkoa:', caption || '');
            if (newCaption === null) return;

            const newTitlePayload = JSON.stringify({
                caption: newCaption.trim(),
                thumb: thumb || 'Subsoccer_tournament_2.jpg'
            });

            if (!sb) return;
            try {
                const { error } = await sb.from('subsoccer_feed').update({
                    creator_handle: newHandle.trim() || '@subsoccer_official',
                    title: newTitlePayload
                }).eq('id', id);
                if (error) throw error;
                await loadManagerItems();
            } catch (err) {
                alert('Edit failed: ' + err.message);
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        window.toggleFeatured = async (id, newFeatured) => {
            if (!sb) return;
            try {
                const { error } = await sb.from('subsoccer_feed').update({ is_featured: newFeatured }).eq('id', id);
                if (error) throw error;
                await loadManagerItems();
            } catch (err) {
                alert('Update failed: ' + err.message);
            }
        };

        window.deleteFeedItem = async (id) => {
            if (!confirm('Are you sure you want to remove this item from the feed?')) return;
            if (!sb) return;
            try {
                const { error } = await sb.from('subsoccer_feed').delete().eq('id', id);
                if (error) throw error;
                await loadManagerItems();
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        };
    </script>
</body>
</html>
